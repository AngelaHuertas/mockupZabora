<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="stylesheet" href="../styles/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header><a href=""><img class="logo" src="../assets/img/logo.png" alt=""></a></header>
 <section class="campoIniciar">
  <h1>Bienvenido a Zabora</h1>
  <label for="E-mail">
    <input type="text" id="E-mail" name="E-mail" required />
  </label>
  <label for="Contraseña">
    <input type="password" id="Contraseña" name="Contraseña" required />
  </label>
  <div class="recordar-olvidar">
    <label for="remember">Recordarme</label>
    <a href="#">¿Olvidaste tu contraseña?</a>
  </div>
  <button type="submit">Iniciar Sesión</button>
  <p>O iniciar sesión con</p>
  <div class="social-login">
    <a href="/auth/google"><img src="" alt="Google" /></a>
    <a href="#"><img src="" alt="Facebook" /></a>    
  </div>
  <p class="recordar-olvidar">¿No tienes una cuenta? <a href="./registro.html">Regístrate</a></p>
 </section>
</body>
</html>
