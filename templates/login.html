<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión - Zabora</title>

  <!-- Fuentes y Boxicons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

  <!-- Estilos externos -->
  <link rel="stylesheet" href="../styles/login.css" />
</head>
<body>

  <!-- Header con logo -->
  <header>
    <a href="#"><img class="logo" src="../assets/img/logo.png" alt="Zabora Logo" /></a>
  </header>

  <!-- Contenedor principal del formulario -->
  <div class="container">
    <form>
      <h1>Iniciar Sesión</h1>

      <!-- Campo correo/usuario -->
      <div class="form-input">
        <input type="text" placeholder="Correo o Usuario" required />
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
          <circle cx="12" cy="8.245" r="2.5" stroke="#265BFF" stroke-width="1.5"/>
          <ellipse cx="12" cy="15.926" stroke="#0A0A30" stroke-width="1.5" rx="5" ry="2.329"/>
        </svg>
      </div>

      <!-- Campo contraseña -->
      <div class="form-input">
        <input type="password" placeholder="Contraseña" required />
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none">
          <path fill="#265BFF" d="M15.236 10.811a.736.736 0 01-.736-.736V8.811a2.5 2.5 0 00-5 0v5H8v-5a4 4 0 018 0v1.236a.764.764 0 01-.764.764z"/>
          <path fill="#fff" d="M6.6 13.704a3 3 0 013-3h4.8a3 3 0 013 3v3a3 3 0 01-3 3H9.6a3 3 0 01-3-3v-3z"/>
          <path fill="#0A0A30" d="M9.6 11.454h4.8v-1.5H9.6v1.5z"/>
        </svg>
      </div>

      <!-- Recordar y olvidar contraseña -->
      <div class="recordar-olvidar">
        <label><input type="checkbox" name="remember" /> Recordarme</label>
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Botón iniciar sesión -->
      <button type="submit">Iniciar Sesión</button>

      <p>O iniciar sesión con</p>

      <!-- Botones sociales -->
      <div class="social-login">
        <button type="button" class="google-btn"><i class='bx bxl-google'></i>Google</button>
        <button type="button" class="facebook-btn"><i class='bx bxl-facebook'></i>Facebook</button>
      </div>

      <p class="registro-link">¿No tienes una cuenta? <a href="./registro.html">Regístrate</a></p>
    </form>
  </div>

</body>
</html>
