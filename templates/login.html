<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>
  <link rel="stylesheet" href="../styles/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <section class="Iniciar-izquierda">
      <img class="logo"  src="../assets/img/logo.png" alt="logo" />
    
    <img class="img-referencia" src="../assets/img/img-referencia.png" alt="perfil" />
  </section>

  <section class="Iniciar-derecha">
    <div class="form-container">
      <h1>Iniciar sesión</h1>
      <form method="post" action="/login">
        <div class="input-group">
          <input type="text" id="username" name="username" required />
          <label for="username">Correo Electrónico</label>
        </div>

        <div class="input-group">
          <input type="password" id="password" name="password" required />
          <label for="password">Contraseña</label>
        </div>

        <div class="recordar-olvidar">
          <label for="remember">Guardar Contraseña</label>
          <a href="#">Olvidé mi contraseña</a>
        </div>

        <button type="submit">Iniciar sesión</button>
        <p>O iniciar sesión con</p>
        

        <div class="social-login">
          <a href="/auth/google"><img src="../assets/img/google.png" alt="Google" /></a>
          <a href="#"><img src="../assets/img/faceebook.png" alt="faceebock" /></a>
        </div>
      </form>
    </div>
  </section>
</body>
</html>
