<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro</title>

  <!-- Fuente Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/registro.css">
</head>
<body>
 

  <!-- Sección izquierda: Formulario -->
  <section class="Iniciar-izquierda">
    <img class="logo" src="../assets/img/logo.png" alt="logo" />
    <div class="form-container">
      <h1>REGISTRARSE</h1>
      <form method="post" action="/registro">
        <!-- Grupo de entrada: correo -->
        <div class="input-group">
          <input type="text" id="username" name="username" required />
          <label for="username">Correo Electrónico</label>
        </div>

        <!-- Grupo de entrada: contraseña -->
        <div class="input-group">
          <input type="password" id="password" name="password" required />
          <label for="password">Contraseña</label>
        </div>

        <!-- Opciones de términos o ayuda -->
        <div class="recordar-olvidar">
          <label for="remember">Aceptar Términos</label>
          <a href="#">¿Necesitas ayuda?</a>
        </div>

        <!-- Botón de registro -->
        <button type="submit">Siguiente</button>

        <!-- Opciones de redes sociales -->
        <p>O registrarse con</p>
        <div class="social-login">
          <a href="/auth/google"><img src="../assets/img/google.png" alt="Google" /></a>
          <a href="#"><img src="../assets/img/faceebook.png" alt="faceebock" /></a>
        </div>
      </form>
    </div>
  </section>

  <!--Sección derecha: Imagen y logo -->
  <section class="Iniciar-derecha">
    <img class="img-referencia" src="../assets/img/img-referencia.png" alt="ilustración" />
  </section>

</body>
</html>
