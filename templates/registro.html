<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registro - Zabora</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/registro.css" />
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script> <!-- Para iconos -->
</head>
<body>
  <header>
    <img src="../assets/img/logo.png" alt="Logo Zabora" class="logo" />
  </header>
<!-- Contenedor principal del formulario -->
  <div class="container">
    <h1>Regístrate en Zabora</h1>
    
    <!-- Botones sociales -->
    <div class="social-login">
      <button class="google-btn" aria-label="Registrarse con Google">
        <i class="fab fa-google"></i> Google
      </button>
      <button class="facebook-btn" aria-label="Registrarse con Facebook">
        <i class="fab fa-facebook-f"></i> Facebook
      </button>
    </div>
 <!-- Campo correo/usuario/contraseña/confirmar contraseña -->
    <form method="post" action="/registro">
      <div class="form-input">
        <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required />
        <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>

      <div class="form-input">
        <input type="email" id="email" name="email" placeholder="Correo electrónico" required />
        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zM4 8l8 5 8-5v-2l-8 5-8-5v2z"/></svg>
      </div>

      <div class="form-input">
        <input type="password" id="password" name="password" placeholder="Contraseña" required />
        <svg viewBox="0 0 24 24"><path d="M12 17a2 2 0 0 0 2-2v-3a2 2 0 0 0-4 0v3a2 2 0 0 0 2 2zm6-6V9a6 6 0 0 0-12 0v2H4v10h16V11h-2zm-8-2a4 4 0 0 1 8 0v2H10V9z"/></svg>
      </div>

      <div class="form-input">
        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirmar contraseña" required />
        <svg viewBox="0 0 24 24"><path d="M12 17a2 2 0 0 0 2-2v-3a2 2 0 0 0-4 0v3a2 2 0 0 0 2 2zm6-6V9a6 6 0 0 0-12 0v2H4v10h16V11h-2zm-8-2a4 4 0 0 1 8 0v2H10V9z"/></svg>
      </div>
<!-- Recordar y olvidar contraseña -->
      <div class="recordar-olvidar">
        <label>
          <input type="checkbox" name="terms" required />
          Acepto los términos
        </label>
        <a href="#">¿Necesitas ayuda?</a>
      </div>

      <!-- Botón registrarse -->
      <button type="submit">Registrarse</button>
    </form>

    <p>¿Ya tienes una cuenta? <a href="./login.html">Inicia sesión</a></p>
  </div>

</body>
</html>
